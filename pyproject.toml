[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navtilvs"
version = "0.1.0"
description = "NAVTILVS: NAVier-Stokes Two-dimensional IncompressibLe Visual Solver"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "computational-fluid-dynamics",
    "navier-stokes",
    "finite-difference",
    "incompressible-flow",
    "fluid-simulation",
    "python",
]
authors = [
    { name = "Filippo Di Ludovico", email = "filippo.diludovico@studio.unibo.it" },
]
maintainers = [
    { name = "Filippo Di Ludovico", email = "filippo.diludovico@studio.unibo.it" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "numpydoc",
]

[project.urls]
"Homepage" = "https://github.com/fildl/NAVTILVS"
"Documentation" = "https://navier-stokes-solver.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/fildl/NAVTILVS/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
